[package]
name = "freakre-scanner"
version = "0.1.0"
edition = "2021"
description = "Core scanning engine for FreakRE — static binary analysis"

[lib]
name = "freakre_scanner"
path = "src/lib.rs"



[features]
default = ["cli"]
decompiler = ["dep:freakre-ir", "dep:decompiler"]
cli = ["dep:clap", "dep:rayon", "dep:walkdir", "dep:colored", "dep:serde_json"]

[dependencies]
serde = { workspace = true }
clap = { version = "4", features = ["derive"], optional = true }
rayon = { version = "1", optional = true }
walkdir = { version = "2", optional = true }
colored = { version = "2", optional = true }
serde_json = { version = "1.0", optional = true }
# Core analysis crates (always needed)
pe-parser = { path = "../pe-parser" }
elf-parser = { path = "../elf-parser" }
macho-parser = { path = "../macho-parser" }
coff-parser = { path = "../coff-parser" }
dex-parser = { path = "../dex-parser" }
wasm-parser = { path = "../wasm-parser" }
flat-binary = { path = "../flat-binary" }
entropy-rs = { path = "../entropy-rs" }
str-extract = { path = "../str-extract" }
import-analyzer = { path = "../import-analyzer" }
yara-lite = { path = "../yara-lite" }
backdoor-analyzer = { path = "../backdoor-analyzer" }
shellcode-analyzer = { path = "../shellcode-analyzer" }
xrefs = { path = "../xrefs" }
cfg-builder = { path = "../cfg-builder" }
func-sigs = { path = "../func-sigs" }
ml-detection = { path = "../ml-detection" }
freakre-x86 = { path = "../freakre-x86" }
freakre-ir = { path = "../freakre-ir", optional = true }
decompiler = { path = "../decompiler", optional = true }

# Own zero-dep replacements
freakre-hash = { path = "../freakre-hash" }
freakre-config = { path = "../freakre-config" }



[dev-dependencies]
tempfile = "3"
