name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # capstone-ffi is a workspace member with a hermetic build: without a
        # system Capstone SDK its build.rs emits no cfg and only the LDE
        # fallback compiles (no bindgen/libclang needed since it was removed).
        # Linux additionally installs libcapstone-dev so the real FFI backend
        # (reached via freakre-desktop) is compiled and linked there too.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install capstone (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcapstone-dev

      # TODO: flip continue-on-error to false once the tree is fully
      # rustfmt-clean (`cargo fmt --all` has not been applied repo-wide yet;
      # `cargo fmt --all -- --check` currently fails).
      - name: rustfmt check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
