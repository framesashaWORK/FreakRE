[package]
name = "project-db"
version = "0.1.0"
edition = "2021"
description = "Persistent storage for BibleTeks reverse engineering projects"
license = "MIT"

[dependencies]
sled = "0.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sha2 = "0.10"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
bitflags = "2.4"

[dev-dependencies]
tempfile = "3.0"
