[package]
name = "project-db"
version = "0.1.0"
edition = "2021"
description = "Persistent storage for BibleTeks reverse engineering projects"
license = "MIT"

[dependencies]
sled = "0.34"
serde = { workspace = true }
bincode = "1.3"
freakre-hash = { path = "../freakre-hash" }
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
bitflags = "2.4"

[dev-dependencies]
tempfile = "3.0"
