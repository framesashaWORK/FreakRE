[package]
name = "freakre-server"
version = "0.1.0"
edition = "2021"
description = "HTTP API server for FreakRE — AI-friendly JSON interface on :8080"
license = "MIT"

[[bin]]
name = "freakre-server"
path = "src/main.rs"

[dependencies]
freakre-scanner = { path = "../scanner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
tempfile = "3"
str-extract = { path = "../str-extract" }
entropy-rs = { path = "../entropy-rs" }
xrefs = { path = "../xrefs" }
