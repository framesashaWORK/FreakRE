<!-- HTMX fragment: replaces upload zone content after successful scan -->
<div class="glass-strong rounded-2xl p-8 text-center glow mt-4 fade-in border-accent/30">
    <div class="w-16 h-16 mx-auto mb-4 rounded-full flex items-center justify-center
        {% if verdict == "Malicious" %}bg-danger/20 text-danger glow-danger
        {% else if verdict == "Suspicious" %}bg-warn/20 text-warn
        {% else %}bg-safe/20 text-safe{% endif %}">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
    </div>

    <h2 class="text-xl font-bold mb-1">Scan Complete</h2>
    <p class="text-gray-400 text-sm mb-5 font-mono">{{ filename }}</p>

    <div class="flex justify-center gap-8 mb-6">
        <div class="text-center">
            <div class="text-2xl font-bold
                {% if verdict == "Malicious" %}text-danger
                {% else if verdict == "Suspicious" %}text-warn
                {% else %}text-safe{% endif %}">
                {{ verdict }}
            </div>
            <div class="text-[10px] text-gray-500 uppercase tracking-widest mt-1">Verdict</div>
        </div>
        <div class="text-center">
            <div class="text-2xl font-bold text-white">{{ "{:.0}"|format(score * 100.0) }}%</div>
            <div class="text-[10px] text-gray-500 uppercase tracking-widest mt-1">Score</div>
        </div>
        <div class="text-center">
            <div class="text-2xl font-bold text-white">{{ findings_count }}</div>
            <div class="text-[10px] text-gray-500 uppercase tracking-widest mt-1">Findings</div>
        </div>
    </div>

    <a href="/report/{{ id }}" class="inline-flex items-center gap-2 px-6 py-3 bg-accent hover:bg-accent-light text-white rounded-xl font-medium transition-all shadow-lg shadow-accent/25 hover:shadow-accent/40">
        View Full Report
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
    </a>
</div>
