<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BibleTeks{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#0a0a0f', 800: '#12121a', 700: '#1a1a2e', 600: '#252540' },
                        accent: { DEFAULT: '#6366f1', light: '#818cf8', dim: '#4f46e5' },
                        danger: { DEFAULT: '#ef4444', light: '#f87171' },
                        warn: { DEFAULT: '#f59e0b', light: '#fbbf24' },
                        safe: { DEFAULT: '#22c55e', light: '#4ade80' },
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', '"Fira Code"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background: #0a0a0f; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
        .glass { background: rgba(18,18,26,0.8); backdrop-filter: blur(12px); border: 1px solid rgba(99,102,241,0.15); }
        .glass-strong { background: rgba(18,18,26,0.95); backdrop-filter: blur(20px); border: 1px solid rgba(99,102,241,0.25); }
        .glow { box-shadow: 0 0 20px rgba(99,102,241,0.15); }
        .glow-danger { box-shadow: 0 0 20px rgba(239,68,68,0.15); }
        .upload-zone { transition: all 0.3s ease; }
        .upload-zone:hover, .upload-zone.dragover { border-color: #6366f1; background: rgba(99,102,241,0.05); }
        .finding-card { transition: all 0.2s ease; }
        .finding-card:hover { transform: translateX(4px); border-left-color: #818cf8; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0f; }
        ::-webkit-scrollbar-thumb { background: #252540; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #353560; }
        .hex-byte { font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.6; }
        .hex-ascii { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #6b7280; }
        .hex-highlight { background: rgba(99,102,241,0.2); border-radius: 2px; }
        .hex-danger { background: rgba(239,68,68,0.2); border-radius: 2px; }
        .hex-warn { background: rgba(245,158,11,0.2); border-radius: 2px; }
        @keyframes scan-line { 0% { top: 0; } 100% { top: 100%; } }
        .scan-progress-bar { animation: scan-line 2s linear infinite; }
        .tab-active { background: #6366f1; color: white; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="glass sticky top-0 z-50 px-6 py-3 flex items-center justify-between">
        <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-accent to-purple-600 flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-accent/20">BT</div>
            <span class="text-xl font-bold tracking-tight">Bible<span class="text-accent">Teks</span></span>
        </a>
        <div class="flex items-center gap-4 text-sm text-gray-400">
            <span class="hidden sm:inline">v0.3.0</span>
            <span class="w-px h-4 bg-gray-700 hidden sm:block"></span>
            <span class="hidden sm:inline">Static Analysis Engine</span>
            <a href="/" class="ml-2 px-3 py-1.5 rounded-lg text-xs font-medium text-gray-300 hover:text-white hover:bg-dark-600 transition-all">Dashboard</a>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl mx-auto px-6 py-8 w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-dark-600 px-6 py-4 text-center text-xs text-gray-600">
        BibleTeks Malware Analysis Engine &copy; 2026 &bull; Powered by Rust + HTMX
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
