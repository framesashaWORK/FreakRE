[package]
name = "freakre-decompiler"
version = "0.1.0"
edition = "2021"
description = "Decompiler: IR to C pseudocode for binary analysis"
license = "MIT"

[dependencies]
freakre-ir = { path = "../freakre-ir" }
freakre-dataflow = { path = "../dataflow" }
freakre-type-propagation = { path = "../type-propagation" }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
indexmap = "2"

