[package]
name = "fsig-gen"
version = "0.1.0"
edition = "2021"
description = "Harvest FLIRT-style .fsig signatures from PE export tables"

[lib]
name = "fsig_gen"
path = "src/lib.rs"

[[bin]]
name = "fsig-gen"
path = "src/main.rs"

[[bin]]
name = "fsig-clean"
path = "src/bin/fsig-clean.rs"

[dependencies]
pe-parser = { path = "../../pe-parser" }
freakre-x86 = { path = "../../freakre-x86" }
func-finder = { path = "../../func-finder" }
func-sigs = { path = "../../func-sigs" }
rayon = "1.10"
sha2 = "0.10"
serde = { workspace = true }
serde_json = "1"

[features]
default = []
arm-capstone = ["dep:capstone-ffi"]

[dependencies.capstone-ffi]
path = "../../capstone-ffi"
optional = true

[dependencies.freakre-ir]
path = "../../freakre-ir"

