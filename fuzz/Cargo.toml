[package]
name = "freakre-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

# Crates to fuzz
pe-parser = { path = "../pe-parser" }
elf-parser = { path = "../elf-parser" }
macho-parser = { path = "../macho-parser" }
import-analyzer = { path = "../import-analyzer" }
str-extract = { path = "../str-extract" }
entropy-rs = { path = "../entropy-rs" }
yara-lite = { path = "../yara-lite" }
freakre-x86 = { path = "../freakre-x86" }
wasm-parser = { path = "../wasm-parser" }
dex-parser = { path = "../dex-parser" }
coff-parser = { path = "../coff-parser" }
flat-binary = { path = "../flat-binary" }
project-db = { path = "../project-db" }
freakre-ir = { path = "../freakre-ir" }
decompiler = { path = "../decompiler" }

[[bin]]
name = "smoke_pe_parser"
path = "smoke_pe_parser.rs"
test = false
doc = false

[[bin]]
name = "smoke_decompiler_ir"
path = "smoke_decompiler_ir.rs"
test = false
doc = false

